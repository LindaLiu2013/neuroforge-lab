<div id="tufe-arch" style="font-family: var(--font-sans, sans-serif); color: var(--seed-fg); padding: 16px; max-width: 900px; margin: 0 auto;">

<style>
  #tufe-arch { font-size: 13px; line-height: 1.5; }
  #tufe-arch h2 { font-size: 18px; font-weight: 500; margin: 0 0 4px; text-align: center; }
  #tufe-arch .subtitle { text-align: center; color: var(--seed-muted); font-size: 12px; margin-bottom: 20px; }
  #tufe-arch svg { width: 100%; height: auto; display: block; }
  #tufe-arch .layer-label { font-size: 11px; fill: var(--seed-muted); }
  #tufe-arch .node-text { font-size: 11px; fill: var(--seed-fg); font-weight: 500; }
  #tufe-arch .node-sub { font-size: 9px; fill: var(--seed-muted); }
  #tufe-arch .arrow-label { font-size: 9px; fill: var(--seed-muted); }
  #tufe-arch .forbidden-text { font-size: 9px; fill: #c0392b; font-weight: 500; }
  #tufe-arch .pivot-box { font-size: 10px; fill: var(--seed-fg); }
  #tufe-arch .pivot-title { font-size: 11px; fill: var(--seed-fg); font-weight: 500; }
</style>

<h2>TUF-E Self-Learning Agent Architecture v0.4</h2>
<p class="subtitle">枢机驱动 · 层级分离 · 耗散维持</p>

<svg viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#5b7fa5"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#5a8a6a"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#b8860b"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#c0392b"/></marker>
  </defs>

  <!-- META LAYER -->
  <rect x="30" y="20" width="800" height="120" rx="8" fill="var(--fill-1)" stroke="#5b7fa5" stroke-width="1.5" opacity="0.3"/>
  <text x="50" y="42" class="layer-label" style="fill:#5b7fa5; font-weight:500;">META LAYER 元层 — Immutable / 不可修改 (C5)</text>

  <!-- Meta nodes -->
  <rect x="120" y="55" width="180" height="60" rx="6" fill="var(--card-bg)" stroke="#5b7fa5" stroke-width="1"/>
  <text x="210" y="80" text-anchor="middle" class="node-text">Consensus Validator</text>
  <text x="210" y="95" text-anchor="middle" class="node-sub">共识验证器 (C3)</text>

  <rect x="560" y="55" width="180" height="60" rx="6" fill="var(--card-bg)" stroke="#5b7fa5" stroke-width="1"/>
  <text x="650" y="80" text-anchor="middle" class="node-text">Truncation Controller</text>
  <text x="650" y="95" text-anchor="middle" class="node-sub">截断控制器 (C5.1)</text>

  <!-- OBJECT LAYER -->
  <rect x="30" y="170" width="800" height="240" rx="8" fill="var(--fill-2)" stroke="#5a8a6a" stroke-width="1.5" opacity="0.3"/>
  <text x="50" y="192" class="layer-label" style="fill:#5a8a6a; font-weight:500;">OBJECT LAYER 对象层 — Modifiable under meta-supervision / 受元层监督可修改</text>

  <!-- Object nodes -->
  <rect x="60" y="210" width="160" height="55" rx="6" fill="var(--card-bg)" stroke="#5a8a6a" stroke-width="1"/>
  <text x="140" y="233" text-anchor="middle" class="node-text">Projection Engine</text>
  <text x="140" y="248" text-anchor="middle" class="node-sub">投影引擎 (C1)</text>

  <rect x="260" y="210" width="160" height="55" rx="6" fill="var(--card-bg)" stroke="#5a8a6a" stroke-width="1"/>
  <text x="340" y="233" text-anchor="middle" class="node-text">Pivot Detector</text>
  <text x="340" y="248" text-anchor="middle" class="node-sub">枢机检测器 (C2+C3)</text>

  <rect x="460" y="210" width="160" height="55" rx="6" fill="var(--card-bg)" stroke="#5a8a6a" stroke-width="1"/>
  <text x="540" y="233" text-anchor="middle" class="node-text">Knowledge Store</text>
  <text x="540" y="248" text-anchor="middle" class="node-sub">知识库·耗散 (P1+C2)</text>

  <rect x="660" y="210" width="140" height="55" rx="6" fill="var(--card-bg)" stroke="#5a8a6a" stroke-width="1"/>
  <text x="730" y="233" text-anchor="middle" class="node-text">Action Executor</text>
  <text x="730" y="248" text-anchor="middle" class="node-sub">动作执行器</text>

  <!-- Learning cycle arrows within object layer -->
  <path d="M220,237 L258,237" stroke="#5a8a6a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M420,237 L458,237" stroke="#5a8a6a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M620,237 L658,237" stroke="#5a8a6a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- Cycle return arc -->
  <path d="M730,265 Q730,310 540,310 Q340,310 140,310 Q60,310 60,265 L60,265" stroke="#5a8a6a" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-green)"/>
  <text x="400" y="325" text-anchor="middle" class="arrow-label" style="fill:#5a8a6a;">Learning Cycle = Dissipative Maintenance / 学习循环 = 耗散维持</text>

  <!-- C3 self-loop on Projection Engine -->
  <path d="M100,210 Q60,180 80,160 Q100,145 140,155 Q170,162 160,185 L155,208" stroke="#5b7fa5" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="75" y="155" class="arrow-label" style="fill:#5b7fa5; font-size:8px;">Cross-observer</text>
  <text x="75" y="165" class="arrow-label" style="fill:#5b7fa5; font-size:8px;">Consensus (C3)</text>
  <text x="75" y="175" class="arrow-label" style="fill:#5b7fa5; font-size:8px;">跨观察者共识</text>

  <!-- PHYSICAL SUBSTRATE -->
  <rect x="30" y="440" width="800" height="110" rx="8" fill="var(--fill-3)" stroke="#b8860b" stroke-width="1.5" opacity="0.3"/>
  <text x="50" y="462" class="layer-label" style="fill:#b8860b; font-weight:500;">PHYSICAL SUBSTRATE 物理基底 L0 — Hardware constraints P1-P6 / 硬件约束</text>

  <!-- Physical nodes -->
  <rect x="80" y="475" width="190" height="50" rx="6" fill="var(--card-bg)" stroke="#b8860b" stroke-width="1"/>
  <text x="175" y="496" text-anchor="middle" class="node-text">Energy Budget Tracker</text>
  <text x="175" y="510" text-anchor="middle" class="node-sub">能量预算追踪 (P1+P2)</text>

  <rect x="330" y="475" width="190" height="50" rx="6" fill="var(--card-bg)" stroke="#b8860b" stroke-width="1"/>
  <text x="425" y="496" text-anchor="middle" class="node-text">State Transition HW</text>
  <text x="425" y="510" text-anchor="middle" class="node-sub">状态转换硬件 (P3+P6)</text>

  <rect x="580" y="475" width="190" height="50" rx="6" fill="var(--card-bg)" stroke="#b8860b" stroke-width="1"/>
  <text x="675" y="496" text-anchor="middle" class="node-text">Thermodynamic Monitor</text>
  <text x="675" y="510" text-anchor="middle" class="node-sub">热力学监控 (P2+P4)</text>

  <!-- INTER-LAYER ARROWS -->
  <!-- Object → Meta: Observation Report (upward) -->
  <line x1="340" y1="210" x2="250" y2="117" stroke="#5b7fa5" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="260" y="170" class="arrow-label" style="fill:#5b7fa5;" transform="rotate(-30,260,170)">Observation Report / 观察报告 ↑</text>

  <!-- Meta → Object: Constraint Signal (downward) -->
  <line x1="610" y1="117" x2="540" y2="208" stroke="#5b7fa5" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="600" y="170" class="arrow-label" style="fill:#5b7fa5;" transform="rotate(30,600,170)">Constraint Signal / 约束信号 ↓</text>

  <!-- Object → Physical: Physical Operations (downward) -->
  <line x1="400" y1="340" x2="400" y2="473" stroke="#b8860b" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="410" y="415" class="arrow-label" style="fill:#b8860b;">Physical Ops / 物理操作 ↓</text>

  <!-- Physical → Object: Energy Feedback (upward) -->
  <line x1="500" y1="473" x2="500" y2="340" stroke="#b8860b" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="510" y="415" class="arrow-label" style="fill:#b8860b;">Energy Feedback / 能量反馈 ↑</text>

  <!-- FORBIDDEN ZONES -->
  <!-- C5-B1: Self-evaluation -->
  <g transform="translate(660,340)">
    <rect width="170" height="38" rx="4" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="22" y="15" class="forbidden-text">✕ C5-B1: Self-evaluation</text>
    <text x="22" y="28" class="forbidden-text">  对象层自评输出</text>
  </g>

  <!-- C5-B2: Modifying meta rules -->
  <g transform="translate(350,140)">
    <rect width="180" height="28" rx="4" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="10" y="18" class="forbidden-text">✕ C5-B2: Object→Meta modification</text>
  </g>

  <!-- C2-B1: Significance pruning -->
  <g transform="translate(60,345)">
    <rect width="200" height="38" rx="4" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="10" y="15" class="forbidden-text">✕ C2-B1: Significance pruning</text>
    <text x="10" y="28" class="forbidden-text">  无拓扑保护的显著性剪枝</text>
  </g>

  <!-- PIVOT DEFINITION CALLOUT -->
  <g transform="translate(30,570)">
    <rect width="800" height="44" rx="6" fill="var(--inset-bg)" stroke="var(--border-standard)" stroke-width="1"/>
    <text x="15" y="16" class="pivot-title">枢机三层定义 Pivot Three-Layer Definition:</text>
    <text x="15" y="32" class="pivot-box">Structure 结构: Irreducible task + constructor 不可再分任务+构造子 (端+故)  │  Time 时间: Complete work cycle 完整工作循环 (刹那)  │  Function 功能: Maintain dissipative steady state 维持耗散稳态</text>
  </g>

</svg>
</div>
