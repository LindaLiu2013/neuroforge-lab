# 预注册: EXP-004 权重重叠压力测试

## 基本信息
- **EXP-ID**: EXP-004
- **日期**: 2026-10-18
- **类型**: STRESS TEST (检验算法在信号模糊条件下的退化行为)
- **依赖**: EXP-001/002/003

## 研究问题
EXP-003 在所有变体上达到 100% 效率，但这可能因为合成图的
桥边/内部边权重差距过大(5-10x)。真实数据中这个差距可能小得多。

本实验系统缩小权重差距，测量算法的**退化曲线**。
不是期望通过，而是期望理解**在什么条件下算法开始失效**。

## 实验设计

### 自变量: 权重分离度 sep_ratio
定义: bridge_weight_max / intra_weight_min
- sep=0.15/0.70 ≈ 0.21 (EXP-001基线, 强分离)
- sep=0.25/0.60 ≈ 0.42 (中等分离)
- sep=0.35/0.50 ≈ 0.70 (弱分离, 接近重叠)
- sep=0.45/0.45 ≈ 1.00 (完全重叠, 键不可区分)

具体参数:
| sep_label | bridge_range | intra_range | sep_ratio |
|-----------|-------------|-------------|-----------|
| strong    | (0.05, 0.15)| (0.70, 1.00)| 0.21      |
| medium    | (0.10, 0.25)| (0.60, 0.90)| 0.42      |
| weak      | (0.15, 0.35)| (0.50, 0.80)| 0.70      |
| overlap   | (0.20, 0.45)| (0.45, 0.70)| 1.00      |

### 固定参数
- 种子: 0-9 (10个)
- keep_ratio: 0.95
- 图结构: V1 baseline (2 basin, 5 bridges)
- 检测参数: alpha=0.2, k=5, p=2.0 (EXP-003最优)

## 预期 (非判据)
- strong: ~1.0 (已确认)
- medium: 0.7-1.0
- weak: 0.3-0.7
- overlap: 0.0-0.3 (接近随机)

## 信息性输出 (非通过/失败)
1. 退化曲线的形状 (线性? 阈值? 相变?)
2. 临界点: 效率降到0.5时的sep_ratio
3. 各信号(权重/介数/跨簇)在不同sep下的单独贡献
4. 显著性剪枝作为对照的退化曲线

## 反论点义务
- 如果overlap下仍有高效率，说明算法利用了非权重信号(介数/社区)
- 如果medium就崩溃，说明算法本质上还是依赖权重差异
- 退化曲线可能依赖于图规模(n_per_basin)
