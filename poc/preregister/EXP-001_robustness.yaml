# 预注册: EXP-001 多信号枢机检测鲁棒性测试

## 基本信息
- **EXP-ID**: EXP-001
- **日期**: 2026-10-18
- **类型**: CONFIRMATORY (验证 v2.2 探索性结果)
- **对应预测**: PR-2 (按权重剪枝先毁键) + v2.2 多信号检测有效性

## 研究问题
v2.2 的多信号融合枢机检测在 seed=42 上达到了 Oracle 100% 效率。
这个结果是真实的算法能力，还是对特定种子过拟合？

## 冻结参数 (不允许事后修改)

### 图构造参数
| 参数 | 值 | 理由 |
|------|-----|------|
| n_per_basin | 30 | v2.2 原值 |
| n_basins | 2 | v2.2 原值 |
| n_bridge_edges | 5 | v2.2 原值 |
| intra_weight_range | (0.7, 1.0) | v2.2 原值 |
| bridge_weight_range | (0.05, 0.15) | v2.2 原值 |
| noise_level | 0.05 | v2.2 原值 |

### 检测算法参数
| 参数 | 值 | 理由 |
|------|-----|------|
| 融合公式 | wr * br * (0.5 if cc else 1.0) | v2.2 原值 |
| n_protect | max(n_communities * 3, 8) | v2.2 原值 |
| Louvain seed | 42 | v2.2 原值 |
| 社区检测回退 | greedy_modularity | v2.2 原值 |

### 实验参数
| 参数 | 值 | 理由 |
|------|-----|------|
| 随机种子范围 | 0-19 (共20个) | 足够估计方差 |
| keep_ratios | [1.0, 0.95, 0.90, 0.80, 0.60] | v2.2 原值 |

## 成功判据 (预定义，不可事后调整)

### 主判据 (必须全部满足)
1. **平均效率 >= 0.70**: 20个种子上，keep_ratio < 1.0 的平均 PH/Oracle 效率 >= 70%
2. **最差种子效率 >= 0.40**: 单个种子的最低效率不低于 40%
3. **显著优于显著性剪枝**: 在所有 keep_ratio < 1.0 下，PH recall > significance recall (Wilcoxon signed-rank p < 0.05)

### 次判据 (报告但不作为通过/失败依据)
- 效率的标准差 < 0.20
- keep_ratio=0.95 时平均 recall >= 0.80
- 检测到的候选枢机中真实键的命中率 (top-5 precision)

## 失败处理预案
- 若主判据1失败但 >= 0.50: 标记为 PARTIAL，需分析失败模式
- 若主判据1 < 0.50: 标记为 FAILED，v2.2 结果为种子特异性
- 若主判据2失败: 分析最差种子的图结构特征，报告异常条件
- 任何失败都不允许调参重跑；需要新 EXP-ID

## 反论点义务
无论结果如何，必须在报告中包含:
1. 至少2个替代解释 (即使结果支持假设)
2. 合成图的生态效度威胁 (synthetic→real 的差距)
3. 置信度自评 (0-100%)

