## v1.9 错在哪(纠正对象)
把"主动取信"写成魔法原子动作 `PROBE⇒reveal h, viable=False`, 未做最小作用量分解,
且在**单步**粒度判 viability ⇒ 制造"两条红线"假墙。本版重建为**多步完整刹那**。

## 最小作用量分解(必要条件全部显式建)
- **施动者**: agent 在 L=5 一维暗屋里有位置 pos(可本体感知), 每循环随机起点
- **目标位置与边界**: 开关在 switch_pos(有坐标); 到达该坐标=进边界(可经"探手"察觉)
- **路径/方法(故)**: 子动作原语 {0左移,1右移,2探手(触觉:是否在开关处),3按下}
  —— "摸"=沿路径的多步搜索, 非瞬移
- **完成判据(端)**: 在开关处按下⇒灯亮⇒隐藏位 h 到手⇒**循环完成**, viability 在此结算
- **主动取信成立**: h/switch_pos **不在被动观测里**, 只能靠 agent 自己移动+探+按取来
- **最小作用量**: 完成循环的动作序列=一个"方法"; 学习单元=**整个循环(刹那)**而非单步

## 学习单元与红线自证
- 枢机 = (起点bucket, 路径签名, 循环viability); **方法由 agent 自己探索组合**, 我不预置任何
  "走到开关"的路径/策略(G6/P-D)。viability 只在循环完成结算, **无单步奖励/无折扣/无价值回传**
  ⇒ 非 RL; 循环边界由"最小作用量走到灯亮"自然定 ⇒ 非设计者硬划。

## 冻结参数
L=5; switch_mode∈{fixed(switch_pos=2), moving(每循环随机)}; BUDGET=12 子步/循环;
n_cycles=2000 工作循环; seeds=[42,43,44]; rho=0(无救援); 探索=4原语均匀随机(不塞方法)

## 三臂(G2 负对照齐)
1. cycle_learn     : 完整刹那粒度, 学 (起点→路径方法), 确认+回放+耗散衰减  — 主测
2. explore_only    : 同域同粒度但**不学**(每循环纯随机)                    — 随机地板
3. singlestep_grain: **错误粒度对照**(逐子步判即时 viability, 学单步动作)   — 复现 v1.9 病

## 预注册判定(互斥, 跑前锁定)
- **H-GRAIN(预期, 证纠正对)**: cycle_learn 的循环成功率 VR 显著 > explore_only 地板 **且** >
  singlestep_grain; 且学到的方法路径确实从起点导航到真 switch_pos 并按下(P-D 内容匹配环境几何)
  ⇒ "在完整刹那粒度结算 viability"让框架能发现+确认单步粒度发现不了的多步主动取信方法。
- **H-NOGAIN(诚实负)**: cycle_learn ≈ explore_only ⇒ 光修粒度不够, 需更深机制(如实报, 不硬凑)。
- **H-GRAINVAL(证伪纠正)**: singlestep_grain 也成功 ≈ cycle_learn ⇒ 粒度不是症结, 我的撤回/纠正
  推理错。这是本实验对"纠正本身"的证伪条件(G1)。
- **H-LEAK/P-D**: 成功路径不对应真实开关位置, 或方法来自我预置 ⇒ 作废重设计。

## OC-9 / OC-12
- OC-9: rho=0; 地板=explore_only 随机成功率; 超额因果有效性 = VR(cycle_learn) − VR(explore_only)
- OC-12: h/switch 信息经 agent 自身移动从**环境门**取来; 方法由 agent 探索组合(非设计者门)

## 停止规则挂钩
跑完对照 S1-S5。若 H-GRAIN 成立⇒纠正被证, 下一步可测 moving_switch(真搜索)或接 Q2 环境内生共演化;
若 H-NOGAIN/H-GRAINVAL⇒如实报负, 重估"粒度"假说, 不为赢续命(守 G5)。
