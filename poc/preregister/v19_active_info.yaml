## 研究问题
v1.8 的解锁靠"重新寻址已观测内容"(零新信息, 仍在"圆"内)。本实验问:
是否存在一类规律——**所需信息不在被动观测流里, 只有采取一个"局部不可存活"的
探测动作才能把它从环境取来**——使得 v1.8 式扩窗(重新寻址)**证明无能为力**?
若能, 则定位出"圆"(重寻址)与"螺旋"(主动取新信息)的真实边界, 并检验
viability-即时/无奖励/无跨步信用分配的引擎能否**内生发现**这种延迟取信动作。

## 域设计 (冻结参数, 不许事后改)
- 隐藏位 h ∈ {0,1}, 每 D 轮刷新一次(一个"任务"), revealed 每任务重置为 False
- 被动观测: 一个随机 token t (对答案**零信息**) + revealed 标志 + (revealed 时的 h)
- 动作空间 = {0, 1, PROBE=2}
  - 正确动作 = h; 播 a∈{0,1}: viable = (a==h); 未 reveal 时 a==h 纯靠猜(0.5)
  - PROBE: **本轮 viable=False**(局部不可存活), 但置 revealed=True 且此后暴露 h 至本任务结束
- chance 地板(纯猜) = 0.5; 随机探测运气 ≈ 0.6-0.7; 学会"任务开头就探测" ≈ (D-1)/D
- rho = 0 (无环境救援); D = 20; n_cycles = 6000; seeds = [42,43,44]
- 寻址键 = r{revealed}_h{h}_tok{最近 w 个 token}; 算子扩的是 **无用 token 窗 w**

## 三臂
1. guess_frozen : w=1, 算子 OFF (基线: 猜 + 随机探测运气)
2. operator_on  : 算子 ON (扩 token 窗) — 预测**无助甚至有害**(h 不在 token 流)
3. oracle_reveal: h 全程可见(设计者 supplied 信息=外部门天花板, 非内生) — 参照 ~1.0

## 预注册判定 (互斥, 跑前锁定)
- **H-DISCOVERY (意外/强)**: VR ≥ 0.85 且探测集中在任务开头(平均探测位置 < D/3)
  ⇒ 引擎内生发现了延迟取信动作。若出现, 须回查是什么机制(现有引擎不该有此能力)。
- **H-LUCK-ONLY (预期)**: VR ∈ [0.50, 0.78] 且探测≈均匀(平均位置 ≈ D/2), 无"探测优先"策略
  ⇒ 引擎**不能**内生发现局部不可存活的取信动作。这是主要预期负结果, 定位 SC-3。
- **H-LEAK (证伪我的主张)**: operator_on 臂仅靠扩 token 窗就把 VR 抬过 guess_frozen 且 > 0.78
  ⇒ "重新寻址≠取新信息"边界被证伪, 或域有信息泄漏, 须重设计。

## 证伪条件 (G1)
- 我的核心主张"重新寻址无法凭空取到不在观测流里的信息": 若 operator_on 显著超过
  guess_frozen 并突破随机运气水平 ⇒ 主张被证伪。
- "引擎无法内生发现延迟取信": 若 H-DISCOVERY 成立 ⇒ 被证伪(意外发现, 须解释机制)。

## 守卫自检 (G1-G6)
- G1 证伪条件: 已写(上)。 G2 负对照: operator_on + oracle_reveal 两参照臂。
- G3 OC-9/OC-12: rho=0 ⇒ 超额因果有效性=VR−0.5(猜地板); h 来自环境(探测门), oracle 臂标"人门"。
- G4 互斥判定: H-DISCOVERY/H-LUCK-ONLY/H-LEAK, 跑完落且仅落一个。
- G5 失败同权: 预期即负结果, 将如实作为主产出报告。
- G6 P-D: PROBE 语义与 h 规则只在环境; 算子只扩窗不写内容。

