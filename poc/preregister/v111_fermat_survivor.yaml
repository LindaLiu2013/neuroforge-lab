# 依据 Jayson 费马纠正: 费马=最小时间(非最短距离, 水折射为证)→更严格=驻定时间(δ=0)→
#   费曼路径积分: 光等效走过所有路径, 失相者相消/驻定者相长, 被观测者=现象学幸存路径, 非绝对预选最短路径

## 基本信息
- EXP-ID: v1.11 (v1.10 M12 编码纠正的可证伪检验)
- 日期: 2026-10-21
- 类型: CORRECTION + FALSIFICATION (对"纠正本身"设证伪条件, 守 G1)
- 依赖: v1.10(H-NOGAIN, M12 结论存疑已打复核旗); v1.9b(H-GRAIN fixed/H-NOGAIN moving);
        M12(费马最小内功, 现纠正为驻定幸存); GC-4(刹那=完整循环); OC-9/OC-12

## v1.10 错在哪(纠正对象)
把 M12 编码成 `min(fire_eligible, key=len(path))` = 在可存活方法里挑**绝对最短** = 费马的
朴素"最短距离"误读。结果: 挑中长度 1 的小样本运气捷径(n=4,v=3,v/n=0.75 但样本太小不可靠)、
丢弃长度 11 的真泛化方法(n=730,v/n=0.54)。这是**用绝对最短压过了存活振幅**, 与 v1.9
"套错数学⇒宣布框架边界"同类。v1.10 因此得出的"M12 适用边界/最小作用量与正确性错位"结论存疑。

## 正确的 M12 编码(费曼路径积分=全体求和后的驻定幸存)
- **走过所有路径(ensemble)**: 每条被捕获的方法(动作序列=path)都是求和里的一条贡献; 引擎须持续
  给**未充分试验**的方法采样机会(不能只回放当前最优, 否则其余 path 永远 n=1 无法参与求和)。
- **失相者相消/驻定者相长(survival amplitude)**: 一条 path 的"存活振幅"= 它在**许多随机开关位置**
  上的跨位置成功率 v/n, 且**对小样本做收缩**(shrink 到随机基率 ~0.34), 使小样本运气捷径的振幅
  被拉回基率而**相消**, 大样本稳健方法的振幅**驻定**显现。
  - survival_score(m) = (v + SHRINK_V) / (n + SHRINK_N), SHRINK_N=10, SHRINK_V=3 (基率≈0.3)
  - 判据: 幸运 n=4,v=3 → (3+3)/(4+10)=0.43; 稳健 n=730,v=394 → (394+3)/(730+10)=0.537 ⇒ 稳健 > 幸运 ✓
- **最小作用量仅作驻定精修(tie-break, 非全局最短者胜)**: 在存活振幅**近似相等**(差<SURV_EPS)的方法
  之间才选**更短**者(费马 δ=0 的驻定精修)。绝不再 `argmin len` 全局选最短。
- **幸存者(survivor)**: 需 n ≥ MIN_SURVIVE_N(=15, 足够多次才算走过), 才够格当现象学幸存路径。

## 红线自证(跑前锁定)
- **非 RL**: 确认单元=整张方法(path), 二元循环 viability, 完整刹那粒度(同 v1.9b/v1.10)。
  无单步奖励/无折扣/无价值回传/TD; v 只在**方法自己的回放动作**按下成功时 +1(整方法归属)。
- **非人门(G6 代码审查)**: 方法内容全部来自 agent 自己执行的轨迹; 引擎不含 switch_pos/sweep/
  coverage/预设方向 token。selection 只用 (n,v,len) 三个内生统计量, 目标无关。survival_score 的
  shrink 基率=explore 随机地板(可测), 非我塞的答案。
- **P-D**: 固化(幸存)方法须在**全新随机开关位置**重跑验证泛化(verify_method_generalizes)。

## 冻结参数
L=5; BUDGET=12; switch_mode=moving; n_cycles=2000; seeds=[42,43,44]; rho=0(无救援);
MIN_SURVIVE_N=15; SHRINK_N=10; SHRINK_V=3; SURV_EPS=0.05; SUM_OVER_PATHS_P=0.3(采样未充分试验
path 进 ensemble 的概率); REPLAY_P=0.9; DECAY_N=30; DECAY_VRATIO=0.35(持续低于随机基率者相消淘汰);
MAX_METHODS=300。探索=4 原语均匀随机(不塞方法)。**所有参数跑前锁定, 跑后不调(守 G5/S4, 防 HARKing)。**

## 四臂(G2 负对照齐 + 人门天花板)
1. survivor_policy : 纠正后 M12(驻定幸存)选方法                            — 主测
2. fixed_path      : v1.9b cycle_learn(start→固定 path, 无条件)            — 负对照(level-0)
3. explore_only    : 同域同粒度**不学**(纯随机)                            — 地板+原料率(≈0.34)
4. oracle_sweep    : 设计者供给的 press/move 覆盖扫遍                      — 人门天花板(=1.0, 非内生)
   (v1.10 policy_learn=朴素最短编码的结果 0.44 作为**历史对照**直接引用, 不重跑)

## 预注册判定(互斥, 跑前锁定)
- **H-SURVIVOR(纠正被证, 预期)**: survivor_policy 的 VR **显著高于** v1.10 policy_learn 的 0.44,
  且固化方法是**稳健泛化者**(best_method_len 不再是退化的 1, PD_generalizes_frac 明显上升),
  且 VR 向稳健方法的内禀 v/n(~0.54~0.78)靠拢 ⇒ "v1.10 的 M12 边界结论是**朴素最短距离编码错误**,
  费曼驻定幸存纠正后病态消失"。**但仍可能 < oracle 1.0**——若如此, 差额归因**生成瓶颈(SC-3)**
  而非选择瓶颈。
- **H-NOGAIN(纠正无效)**: survivor_policy ≈ v1.10 的 0.44(或 ≈ explore 地板) ⇒ argmin-长度**不是**
  真瓶颈, 换选择规则不改善结果 ⇒ 我的费曼纠正虽物理正确但**对引擎结果无影响**, 纠正被证伪为
  "不是症结"(如实报, 守 G5)。
- **H-CAP(选择修好但撞生成天花板)**: VR 上升但**明确封顶**在 oracle 之下(如 0.5~0.8), 且固化方法
  仍非干净全覆盖扫遍 ⇒ **选择瓶颈已解、生成瓶颈(结晶系统覆盖)是唯一剩余坎** ⇒ 触发 S5 交回
  Jayson(跨过生成瓶颈需组合算子=预注册已否决的人门风险 B, **不擅自加**)。
- **H-SUPPLIED/P-D(作废)**: 幸存方法不对应真实开关几何, 或 selection 用了非内生信息 ⇒ 作废重设计。

## OC-9 / OC-12
- OC-9: rho=0; 地板=explore_only 随机成功率; 超额因果有效性 = VR(survivor_policy) − VR(explore_only)
- OC-12: 蒸馏/选择时刻**零新信息**进入(pos/feel/成功轨迹早被经历; survival_score 只重表达既有 (n,v));
  VR 增益不伴随额外信息注入; oracle 1.0=外部门(设计者供给覆盖知识), 系统不可自生。

## 停止规则挂钩
跑完对照 S1-S5。
- 若 H-SURVIVOR 且达/近 oracle ⇒ 纠正被证且生成瓶颈也被驻定幸存自然跨过(需复核 P-D 确保非侥幸)。
- 若 H-SURVIVOR 但 H-CAP(封顶 oracle 下) ⇒ 选择瓶颈已解, **生成瓶颈交回 Jayson**(不擅自加组合算子)。
- 若 H-NOGAIN ⇒ 如实报负, 重估"选择编码"假说, 不为赢续命。
据 G5/S4: **不"再试一个 seed/参数就能赢"续命, 参数跑前锁定跑后不调。**
