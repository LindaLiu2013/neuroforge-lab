## v1.11 暴露的真墙(纠正对象)
oracle 达 1.0 不是更聪明, 是**闭环**: 它对观测反应(探到开关→按; 探到非开关→记住已排除→移向未排除格)。
agent 的方法=**开环固定动作序列**, 不反应⇒对**移动**目标结构上无法全覆盖(最好幸存者 P-D 仅 0.6)。
⇒ 内生结晶必须把方法**从"固定 path"重表达为"观察反应策略"**。

## 关键人门判断(透明声明, 设为杀死条件)
系统搜索需**循环内记忆**"哪些格已探过且排除"。给这个记忆=是否偷运覆盖答案?
**判断: 否**——该记忆=agent **保留自己过去的观测**, 正是 v1.8 P-A 确认合法的"重新寻址观测流内已有信息"
(零新信息, OC-12 L1 重组)。覆盖的**形式**仍须由环境选择涌现; 我不供给任何 coverage/sweep/direction/
visited-as-answer token。**杀死条件 H-SUPPLIED**: 若唯一能让它work的方式是硬编码"下一格试哪"/覆盖目标⇒人门, 作废。

## 内生结晶机制(全内生, 无覆盖知识注入)
- **表达(re-representation)**: 一条方法=**闭环反应策略** genome[320], 状态索引=(pos∈0..4, feel∈0..1,
  ruled∈0..31 位掩码)。ruled=agent 本循环内"探到负(FEEL 且不在开关)"的格的**自身观测留存**(v1.8 合法重寻址)。
  state_index = pos*64 + feel*32 + ruled。action∈{0左,1右,2探,3按}。未覆盖状态→随机兜底。
- **变异(variation, OC-12 随机门)**: 随机翻转 genome 里若干状态的动作。**纯随机, 不含方向/覆盖偏好。**
- **自己总结成功方法(Lamarckian self-summary)**: 记录所有**成功循环**经历的 (state→action) 到 tally;
  繁殖时以 LAMARK_P 把 tally-argmax(support≥MIN_SUPPORT)写回子代 genome=把"成功时我做了什么"总结进后代。
- **选择=整体策略循环 viability(耗散选择, 非 RL)**: 每条 genome 在 W 个循环上测**整策略二元 viability 比例**;
  存活者(高 viability)保留+繁殖, 失败者耗散淘汰(elitism+填充)。**无单步奖励/无折扣/无价值回传/TD/梯度**;
  viability 只在完整刹那(灯亮)结算一次(同 v1.9b/v1.11 grain)。这是 Prigogine 耗散选择, 非 reward 最大化。

## 红线自证(跑前锁定)
- **非 RL**: 选择单元=**整条反应策略**, 二元循环 viability, 完整刹那粒度; 变异=随机搜索非策略梯度;
  tally 仅作**提议生成器**(总结成功时做了啥), **确认在整策略 grain**(整条 genome 被 viability 接受/淘汰),
  绝不给单个 (state,action) 按延迟结果记功。
- **非人门(G6 代码审查)**: genome 初值随机; 变异随机; tally 来自 agent 自己的成功轨迹; ruled 来自 agent
  自己的 FEEL 观测留存; 引擎不含 switch_pos/sweep/coverage/预设方向/visited-as-target token。冻结元规则
  (变异+self-summary+整策略 viability 选择)=**π 轴设计者冻结 FORM**(同 v1.8 压缩算子诚实地位), 系统内生的是
  **哪条反应策略存活(CONTENT, 环境门验证)**, 非发明搜索程序本身。此诚实边界跑前声明。
- **P-D**: 固化(幸存)genome 须在**全新随机开关位置**重跑验证泛化(不靠记忆特定 switch)。

## 冻结参数(跑前锁定, 跑后不调, 守 G5/S4)
L=5; BUDGET=12; switch_mode=moving; n_cycles=2000; seeds=[42,43,44]; rho=0;
K=8(种群); W=25(每条 genome 评估循环数); MUT_STATES=6(每次变异翻转状态数); MIN_SUPPORT=3(tally 最小支撑);
LAMARK_P=0.5(self-summary 写回概率); ELITE=2(精英保留)。探索兜底=均匀随机。

