## 预注册判定(互斥, 跑前锁定)
- **H-CRYSTALLIZE(内生跨过 SC-3, 强正结果)**: reactive_crystallize 的 VR **显著 > reactive_no_learn 且 >
  v1.11 openloop 0.422**, 向 oracle 1.0 靠拢(如 ≥0.8), 且固化 genome 是**观察反应的**(真的用 feel/ruled, P-D
  泛化高) ⇒ **闭环反应覆盖策略由内生结晶(变异+self-summary+耗散选择)涌现, 无覆盖答案注入**=SC-3 被内生跨过。
- **H-PARTIAL(诚实部分)**: VR 上升但**封顶 oracle 之下**(如 0.5~0.8) ⇒ 内生结晶**真实但不完整**(预算/表达受限);
  如实报上升幅度与固化策略形态, 定位剩余差距。
- **H-NOGAIN(负=主产出)**: reactive_crystallize ≈ reactive_no_learn ≈ openloop(或更低) ⇒ 重表达+变异+总结
  **仍结晶不出覆盖**; 若诊断到"成功循环被 start==switch 运气污染⇒self-summary 结晶出退化 always-PRESS 习惯"
  则精确定位 SC-3 黑洞的机制(运气污染 + 缺新行为变异源), 交回 Jayson。
- **H-SUPPLIED/P-D(作废)**: 固化 genome 不对应真实覆盖几何, 或只能靠硬编码"下一格"才work ⇒ 人门, 作废重设计。

