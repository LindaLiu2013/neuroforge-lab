# 预注册: EXP-003 自适应参数 + 复杂度压力测试

## 基本信息
- **EXP-ID**: EXP-003
- **日期**: 2026-10-18
- **类型**: CONFIRMATORY (回应 EXP-002 SENSITIVE 结果)
- **依赖**: EXP-001 (CONFIRMED), EXP-002 (SENSITIVE)

## 研究问题
EXP-002 显示算法对参数敏感，且存在明确的最优方向：
- alpha 小 → 好 (跨簇信号重要)
- k 大 → 好 (多保护无害)
- p 大 → 好 (弱化低权重排名优势)

两个问题需要回答：
1. 使用 EXP-002 发现的最优参数组合，在完整20种子上是否稳健？
   (注意：这不是事后调参救结论，而是将探索性发现作为新假设检验)
2. 增加拓扑复杂度(更多basin、层次结构)后，算法是否仍然有效？
   (直接检验 EXP-001 反论点2)

## Part A: 最优参数确认

### 参数设置 (基于 EXP-002 发现)
| 参数 | EXP-001默认 | EXP-003新值 | 理由 |
|------|------------|------------|------|
| alpha | 0.5 | 0.2 | EXP-002中alpha=0.2效率1.0 |
| k | 3 | 5 | EXP-002中k=5效率0.96 |
| p | 1.0 | 2.0 | EXP-002中p=2.0效率1.0 |

### 成功判据
- 20种子平均效率 >= 0.85 (不低于EXP-001的0.86)
- 最差种子效率 >= 0.50 (优于EXP-001的0.40要求)

## Part B: 复杂度压力测试

### 新增图构造变体
| 变体 | n_basins | n_bridge_edges | 特殊结构 |
|------|----------|---------------|---------|
| V1 基线 | 2 | 5 | 同EXP-001 |
| V2 多basin | 4 | 10 | 链式连接(basin_i ↔ basin_{i+1}) |
| V3 星型 | 4 | 6 | 中心basin连接所有外围 |
| V4 层次 | 3 | 8 | basin内嵌子basin(子群内部强连接) |

### 成功判据
- V2/V3/V4 的平均效率 >= 0.50 (允许下降但不崩溃)
- 若某变体 < 0.50，报告具体失败模式

## 冻结参数
- 种子: 0-19 (Part A), 0-9 (Part B, 计算量大)
- keep_ratio: [0.95, 0.90] (两个关键剪枝点)
- 图基础参数: n_per_basin=30, 权重范围同前

## 反论点义务
- Part A 的最优参数来自同一批数据的探索，有循环验证风险
- Part B 的合成复杂度仍远低于真实系统
- 若 Part A 提升但 Part B 下降，说明参数优化过拟合简单拓扑
