# K-BACKGROUND-HONESTY: background rho for OC-9 must come from a FROZEN-RANDOM control
#   arm run under the SAME drift, not a hand-picked constant.
#
# ========================= ARMS =========================
# drift grid (per-step toggle prob): 0.0, 0.005, 0.02, 0.05, 0.10, 0.20, 0.40
# seeds per arm: 4   (single-seed conclusions forbidden — v1.6 lesson)
# horizon: 4000 steps/run
# controls: frozen_random (ops fixed random, no minting/consolidation) at each drift
