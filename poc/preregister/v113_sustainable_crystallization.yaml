#
# ========================= METRICS (feasibility, not optimality) =========================
# survival_rate      : fraction of seeds alive at horizon (budget>0 throughout)
# feasible_volume V  : count of live ops (conc >= CONC_MIN) — FS-C3 viable-space proxy
# coupling_coverage  : over trailing window, fraction of steps where >=1 live op would
#                      couple to the TRUE pattern (can the repertoire sustain itself now)
# minting_rate(t)    : consolidated genuinely-new ops per window (new = couples to a
#                      pattern its parents could not)
# excess_causal_validity (OC-9): live-repertoire coupling rate - frozen_random rho
# steady_state class : PLATEAU / COLLAPSE / FROZEN / UNBOUNDED from V(t) second-half
#                      slope + variance + minting tail
#
# ========================= JUDGMENTS =========================
# H-SUSTAINABLE-BAND : P-BAND and P-SUSTAIN and P-FROZEN and P-COLLAPSE all hold.
#   -> ANSWER to Jayson: sustainable crystallization = non-equilibrium steady state
