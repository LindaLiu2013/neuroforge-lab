# 预注册: EXP-002 参数敏感性分析

## 基本信息
- **EXP-ID**: EXP-002
- **日期**: 2026-10-18
- **类型**: CONFIRMATORY (检验 EXP-001 结果的参数鲁棒性)
- **依赖**: EXP-001 (已 CONFIRMED)

## 研究问题
EXP-001 确认了多信号融合检测的有效性，但使用了固定参数。
如果效率对参数微调高度敏感，则算法不可靠；如果在合理范围内稳定，则可信度提升。

## 测试维度 (共3个，独立扫描)

### D1: 跨簇惩罚系数 alpha
- 当前值: 0.5 (score = wr * br * alpha if cc else wr * br)
- 扫描范围: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0]
- 含义: alpha=1.0 表示不使用跨簇信号; alpha→0 表示极度偏重跨簇边

### D2: n_protect 倍数因子 k
- 当前值: max(n_communities * 3, 8), 即 k=3
- 扫描范围: k = [1, 2, 3, 5, 8]
- 含义: 保护多少条候选枢机边

### D3: 权重排名指数 p
- 当前值: score = wr^1 * br^1 * ...
- 扫描范围: p = [0.5, 1.0, 2.0] (score = wr^p * br * ...)
- 含义: p>1 弱化低权重边的优势; p<1 强化

## 冻结参数
- 种子: 固定5个代表性种子 [0, 4, 9, 14, 19] (覆盖低/中/高效率)
- keep_ratio: 固定 0.95 (最关键的剪枝点)
- 图构造参数: 与 EXP-001 完全相同

## 成功判据

### 主判据
1. **D1 稳定性**: alpha 在 [0.2, 0.7] 范围内，效率变化 < 0.15
2. **D2 稳定性**: k 在 [2, 5] 范围内，效率变化 < 0.15
3. **D3 稳定性**: p 在 [0.5, 2.0] 范围内，效率变化 < 0.20

### 信息性输出 (非通过/失败)
- 每个维度的最优参数值
- 参数交互效应 (是否存在某个组合显著优于默认)
- 退化边界 (参数到什么值时算法崩溃)

## 反论点义务
- 如果所有参数都敏感，说明算法是"调出来的"而非"发现的"
- 如果只有默认参数好，说明过拟合风险高
- 参数空间的离散采样可能错过最优区域
