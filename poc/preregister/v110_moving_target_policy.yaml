## v1.9b 交出的待建对象(前沿)
v1.9b moving 域: 开关每循环随机换位后三臂全塌地板(cycle_learn 0.372/P-D 0.20)。
**诊断**: cycle_learn 学的是"起点→固定路径"的**记忆块**; 目标一动, 路径内容对不上新几何 ⇒ 失效。
**前沿主张(待检)**: 移动目标需要的是**由局部手感(FEEL)调制的条件搜索策略**——"方法(故)"从**固定轨迹**
升级为**状态条件化例行程序(routine)**; 而这个 routine **不靠随机搜遍策略空间得到, 靠费马最小作用量从成功经验里蒸馏**。

## 决策 (C) 的机制(Jayson 纠正方向, 替代我原来的 A/B 假两难)
**我原来的假两难**: (A)纯随机搜 (状态→原语) 表, 空间 ~4^10≈1e6, 2000 循环搜不到 ⇒ 必落 H-NOGAIN;
(B)加组合算子拼片段 ⇒ 人门风险(可能等于我编码了"扫遍")。
**Jayson 的第三角度(已锁)**: 搜索**不在策略空间上, 而在工作循环上**——
- **一次成功的经验**: 随机探索在 L=5/BUDGET=12 下, 每循环"摸到开关并按下"的成功率约 1/3(v1.9b explore_only=0.334 已测),
  **原料充足**, 不是百万分之一。成功循环就是蒸馏的原料。
- **多次成功→肌肉记忆**: 成功循环执行的轨迹被捕获, 用 agent **自己的局部状态 (pos, feel)** 重新表达成条件 routine;
  反复成功 ⇒ 走现有 fire 判据(n>=3 & v>=0.5n)固化成"肌肉记忆"(回放, 不再随机)。
- **费马(M12)最小作用量蒸馏**: 在**多条成功经验、且开关位置每循环不同**的条件下, 只保留**最小作用量**且
  **跨位置反复可存活**的 routine。位置专属的运气轨迹在新开关位置上点不亮 ⇒ viability 比例下降 ⇒ 耗散衰减淘汰;
  唯一能跨所有位置稳定存活的最小作用量 routine = **一个方向一致的系统扫遍 + 手感命中即按** ⇒ **扫遍策略是 M12 蒸馏出来的, 不是我编码的**。

## 最小作用量分解(承接 v1.9b 四要素)
- **施动者**: agent 在 L=5 一维暗屋有位置 pos(本体感知), 每循环随机起点
- **目标/边界(端)**: 开关 switch_pos **每循环随机换位**, 不被动可观测; 边界="是否在 switch_pos", 只能靠 FEEL(局部即时零延迟触觉)
- **路径/方法(故)**: 状态条件 routine = 一张 (局部状态 bucket=(pos,feel) → 原语) 的部分映射, **由成功轨迹捕获**, 非我预置
- **完成判据(刹那边界)**: 一个完整循环(≤BUDGET 子步)内点亮灯; viability 只在循环完成结算一次

## 学习单元与红线自证(C5/RL/人门 三重守卫, 跑前锁定)
1. **非 RL 守卫(粒度, 最尖锐)**: 被确认的单元 = **整张条件 routine(一个刹那的"故")**, 由该循环**二元** viability
   原子确认/否决 —— 与 v1.9b 确认整条路径的粒度**完全相同**。**禁止**每步奖励/折扣/价值回传/TD。
   **红线**: 不得"按循环最终成败去给单个 (状态→原语) 条目分别记功"(=跨步信用=RL 漂移)。
   正确做法: routine 作为**整体**被二元结果确认; 跨位置泛化**不靠信用分配**, 靠"在新开关位置上重跑整张 routine,
    viable 则再确认、不 viable 则整张衰减"——这是**整单元×变化环境**的选择, 不是逐步信用。
2. **非人门守卫(P-D + 代码审查)**: routine 的**内容**全部来自 agent 自己的成功轨迹(用它自己的 pos/feel 观测重表达),
   我不写任何原语/方向/"扫遍"。M12 只选"最短且跨位置可存活", 不含目标知识。
   引擎代码里**不得出现** switch_pos / sweep / coverage / 预设方向 字样(建好做代码审查留证, G6)。
   FEEL 是 agent 自己的本体触觉, 用它做条件键 = 用自己的观测, 非我塞结构。
3. **P-D 内容溯源(泛化检验)**: 最终固化的 routine 必须丢回环境**在若干全新随机开关位置上重跑**, 真能扫到并按亮
   ⇒ 内容来自环境门且**泛化到没见过的开关位置**; 若只在训练见过的位置有效 = 记的是答案不是方法 ⇒ 作废。
4. **随机探索不塞方法**: 无 routine 或 routine 无对应条目时, 4 原语均匀随机(G6)。

## 冻结参数
L=5; switch_mode=moving(每循环 switch_pos 随机); BUDGET=12 子步/循环; n_cycles=2000; seeds=[42,43,44];
rho=0; 局部状态 bucket=(pos∈0..4, feel_at_switch∈{0,1}); fire 判据 n>=3 & v>=0.5n(沿用, ="肌肉记忆"阈值);
M12 选择=在可存活 routine 中取执行步数最短者; 耗散衰减=viability 比例 < 阈值的 routine 强度衰减、低于下限淘汰

## 四臂(G2 负对照齐 + 人门天花板标定)
1. policy_learn  : (C) 机制 — 随机探索→捕获成功轨迹为条件 routine→M12 最小作用量蒸馏→跨位置反复确认固化 — **主测**
2. fixed_path    : =v1.9b cycle_learn(起点→固定路径, 无条件化) — **负对照**(预期 moving 域塌地板, 复现 H-NOGAIN)
3. explore_only  : 同域同粒度但**不学**(每循环纯随机) — **随机地板 + 原料可得性**(测成功率, 验证"一次成功经验"是否充足)
4. oracle_sweep  : 我**手工供给**"方向一致扫遍→FEEL命中→PRESS"覆盖策略 — **人门天花板, 仅标定**, 明确**非内生**(OC-12 外部门),
                   量"缺失能力"价值上限, 绝不计入"系统自己学会"主张

## 预注册判定(互斥, 跑前锁定)
- **H-POLICY(预期, 前沿被达到)**: policy_learn 循环成功率 VR **显著 > explore_only 地板(≈0.33) 且 > fixed_path 负对照**;
  且固化的 routine **是状态条件化的**(含 feel 键)、**P-D 通过**(在全新随机开关位置重跑仍扫到按亮)、
  **执行步数逼近 oracle_sweep 的最小作用量**(M12 蒸馏出效率) ⇒ "费马最小作用量从成功经验蒸馏条件 routine"
  让框架内生形成**追踪移动目标**的搜索策略, 扫遍由 M12 涌现、非编码。
- **H-NOGAIN(诚实负 = 主产出)**: policy_learn ≈ explore_only / ≈ fixed_path; 或 routine 固化了但 P-D 不泛化到新开关位置;
  或 explore_only 成功率过低致"一次成功经验"原料不足 ⇒ 移动目标条件策略是现有引擎+M12 蒸馏达不到的真边界;
  如实报, 定位下一层缺失机制, **不硬凑、不为赢续命(守 G5/S4)**。
- **H-SUPPLIED(证伪/作废)**: policy_learn 达 oracle 水平**但 P-D 显示不泛化**, 或代码审查发现混入 switch_pos/sweep/预设方向
  ⇒ 人门污染, 作废重设计(G1 杀死条件)。
- **H-GRAINVAL(反噬 v1.9b)**: fixed_path(无条件化)在 moving 域也 ≈ policy_learn ⇒ v1.9b H-NOGAIN 诊断错,
  "需要条件策略"前沿不成立; 这是对 v1.9b 结论的证伪条件(G1)。

## OC-9 / OC-12
- OC-9: rho=0; 地板=explore_only; 超额因果有效性 = VR(policy_learn) − VR(explore_only)
- OC-12: 开关位置每循环经 agent 自身移动+FEEL 从**环境门**取来(移动目标=每循环刷新环境门内容);
  routine **内容**来自 agent 成功轨迹(非设计者门); M12 只选最短、不含目标知识(π 轴冻结判据, 同 v1.8 算子地位);
  oracle_sweep=外部门, 系统不可自生, 仅标定
- **信息核算关键问**: 蒸馏时刻**有无新信息进入**? 预期**没有**——pos/feel 早是可观测原语, 成功轨迹早被经历,
  M12 只是从已有经验里**选最小作用量并重表达成条件形式**(承接 v1.8 "重寻址≠造新信息"); 若 VR 增益伴随额外信息注入 ⇒ 查门。

## 停止规则挂钩(S1-S5)
- H-POLICY 成立 ⇒ 前沿被达到, 下一步接 Q2(环境内生共演化, M8 升级)或 Q3(更强重压缩天花板)。
- H-NOGAIN ⇒ 如实报负, 定位下一层缺失机制; 若该机制无法从 L0/L1/已确认模型推出且需 RL/人门 ⇒ 触发 S5 停, 交回 Jayson, 不硬凑。
- H-SUPPLIED ⇒ 作废重设计(G1), 记入失败档。
- 全程守 G5(失败=成功同等主产出); 守 S4(不"再试一个 seed/参数就能赢"式自我重复续命)。

## 决策记录
- (A) 纯随机搜策略空间: **否决** — 空间 1e6, 2000 循环搜不到, 必落 H-NOGAIN, 是假两难的一支。
- (B) 加组合算子拼片段: **否决** — 组合规则离"编码扫遍答案"太近, 人门风险最尖锐。
- **(C) 费马最小作用量蒸馏 + 肌肉记忆固化: 已锁(Jayson 定)** — 搜索在工作循环上(原料成功率≈1/3 充足),
  学习=M12 从成功经验蒸馏跨位置最小 routine, 扫遍涌现非编码, 且只复用已确认模型(M12)+现有 fire 判据, **不引入新冻结组件**。
